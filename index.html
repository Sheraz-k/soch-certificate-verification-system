<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOCH Foundation - Certificate Verification</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #fff; padding: 2.5rem; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 480px; text-align: center; border-top: 6px solid #004d25; }
    .logo { width: 110px; height: auto; margin-bottom: 0.5rem; }
    h2 { color: #004d25; margin-bottom: 0.2rem; margin-top: 0; font-size: 1.5rem; }
    p.subtitle { color: #555; margin-bottom: 1.5rem; font-size: 0.95rem; }
    .input-group { display: flex; justify-content: center; gap: 8px; margin-bottom: 1rem; }
    input { width: 70%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; text-align: center; }
    button { background: #004d25; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 0.95rem; font-weight: bold; transition: background 0.2s; }
    button:hover { background: #003318; }
    .result { margin-top: 1.5rem; text-align: left; padding: 15px; border-radius: 6px; display: none; line-height: 1.6; }
    .valid { background: #e6f4ea; border: 1px solid #34a853; color: #137333; }
    .invalid { background: #fce8e6; border: 1px solid #ea4335; color: #c5221f; text-align: center; }
    .share-link { margin-top: 10px; font-size: 0.85rem; color: #555; word-break: break-all; background: #fff; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
  </style>
</head>
<body>

<div class="card">
  <!-- SOCH Foundation Logo -->
  <img src="soch-logo.jpeg" alt="SOCH Foundation Logo" class="logo">
  <h2>SOCH Foundation</h2>
  <p class="subtitle">Certificate Verification Portal</p>

  <div class="input-group">
    <input type="text" id="certId" placeholder="Enter Certificate ID">
    <button onclick="handleManualVerify()">Verify</button>
  </div>

  <div id="result" class="result"></div>
</div>

<script>
  // Paste your Published Google Sheet CSV URL here (File > Share > Publish to web > CSV)
  const GOOGLE_SHEET_CSV_URL = "YOUR_PUBLISHED_GOOGLE_SHEET_CSV_URL_HERE";

  window.onload = function() {
    const urlParams = new URLSearchParams(window.location.search);
    const idParam = urlParams.get('id');
    if (idParam) {
      document.getElementById('certId').value = idParam;
      fetchAndVerify(idParam);
    }
  };

  function handleManualVerify() {
    const inputId = document.getElementById('certId').value.trim();
    if (inputId) {
      const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?id=' + encodeURIComponent(inputId);
      window.history.pushState({ path: newUrl }, '', newUrl);
      fetchAndVerify(inputId);
    }
  }

  async function fetchAndVerify(certificateId) {
    const resultDiv = document.getElementById('result');
    let cert = null;

    // 1. Try fetching dynamically from Google Sheets CSV first
    if (GOOGLE_SHEET_CSV_URL && GOOGLE_SHEET_CSV_URL !== "YOUR_PUBLISHED_GOOGLE_SHEET_CSV_URL_HERE") {
      try {
        const response = await fetch(GOOGLE_SHEET_CSV_URL);
        const csvText = await response.text();
        const rows = csvText.split('\n').map(row => row.split(','));
        
        // Match Certificate ID column (index 0)
        for (let i = 1; i < rows.length; i++) {
          const col = rows[i].map(cell => cell.trim().replace(/^"(.*)"$/, '$1'));
          if (col[0] && col[0].toLowerCase() === certificateId.toLowerCase()) {
            cert = { id: col[0], name: col[1], program: col[2], batch: col[3], issue_date: col[4] };
            break;
          }
        }
      } catch (e) {
        console.warn("Could not load Google Sheet, falling back to JSON:", e);
      }
    }

    // 2. Fallback to local certificates.json if not found in Google Sheets
    if (!cert) {
      try {
        const response = await fetch('certificates.json');
        const certificates = await response.json();
        cert = certificates.find(c => c.id.toLowerCase() === certificateId.toLowerCase());
      } catch (err) {
        console.error("Failed to load certificates.json:", err);
      }
    }

    // Display Result
    if (cert) {
      const fullShareableUrl = window.location.origin + window.location.pathname + '?id=' + cert.id;
      resultDiv.className = 'result valid';
      resultDiv.style.display = 'block';
      resultDiv.innerHTML = `
        <h3 style="margin-top:0; color:#137333;">✓ Authenticity Verified</h3>
        <p><strong>Student Name:</strong> ${cert.name}</p>
        <p><strong>Program:</strong> ${cert.program}</p>
        <p><strong>Batch:</strong> ${cert.batch || 'Batch I'}</p>
        <p><strong>Certificate ID:</strong> ${cert.id}</p>
        <p><strong>Issue Date:</strong> ${cert.issue_date}</p>
        <hr style="border:0; border-top:1px solid #b7e1cd; margin:10px 0;">
        <!--<div class="share-link"><strong>Verification URL:</strong><br>${fullShareableUrl}</div>-->
      `;
    } else {
      resultDiv.className = 'result invalid';
      resultDiv.style.display = 'block';
      resultDiv.innerHTML = '<strong>Not Found:</strong> Invalid or unverified Certificate ID.';
    }
  }
</script>

</body>
</html>
